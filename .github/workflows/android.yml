name: Android face
on:
  push:
    branches: [main, port/android-face, port/secure-device-link, port/ai-voice-foundation, port/live-ai-voice, port/screen-understanding]
    paths: ['android/**', 'Shared/Fonts/**', 'protocol/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main, port/live-ai-voice]
    paths: ['android/**', 'Shared/Fonts/**', 'protocol/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK packages (CI only)
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Unit tests, native bitmap renders, lint and debug APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Unit and lint result summary
        run: |
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          reports=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert reports, 'JUnit reports missing'
          totals={k:0 for k in ('tests','failures','errors','skipped')}
          for file in reports:
              row=ET.parse(file).getroot()
              for key in totals: totals[key]+=int(row.get(key,0))
          print('JUnit totals:',totals)
          lint=ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          counts={}
          for issue in lint.findall('issue'): counts[issue.get('severity')]=counts.get(issue.get('severity'),0)+1
          print('Lint severities:',counts)
          PYTHON
      - name: APK signature verification and digest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SIGNING-CERT.txt
          cat app/build/outputs/apk/debug/SIGNING-CERT.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: bluey-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/SIGNING-CERT.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-test-evidence-${{ github.sha }}
          path: |
            android/app/build/test-results/
            android/app/build/reports/
            android/app/build/renders/
          if-no-files-found: warn
          retention-days: 14
